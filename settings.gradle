import groovy.json.JsonSlurper

// tweakercontainer 的多版本构建：每个 MC 版本一个子项目，项目目录在 versions/<版本>，
// 各自的 build.gradle 与 gradle.properties 独立，源码也各放各的（版本之间互不影响）。
pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()

        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Masa'
            url = 'https://masa.dy.fi/maven/sakura-ryoko'
        }
    }
}

// 26.2 需要 Java 25：本机没装的话让 Gradle 自己下载一个 JDK 25 工具链
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

Map<String, List<String>> settings = file('settings.json').withReader {
    new JsonSlurper().parse(it) as Map<String, List<String>>
}

for (String version : settings.get('versions')) {
    include(":$version")

    ProjectDescriptor proj = project(":$version")
    proj.setProjectDir(file("versions/$version"))
}

rootProject.name = 'tweakercontainer'
