import groovy.json.JsonSlurper

// 根项目只负责：声明 Loom 插件版本（各版本子项目按需 apply）、提供一次构建所有版本的入口。
// 两个插件 id 是同一套 Loom 的两种变体：
//   fabric-loom（= fabric-loom-remap）：给有混淆的版本用，需要 mappings，产物走 remapJar
//   net.fabricmc.fabric-loom：给 26.1+ 这种官方已不再混淆的版本用，不需要 mappings
plugins {
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// 一次构建 settings.json 里列出的所有 MC 版本：gradlew buildAll
tasks.register('buildAll') {
    group = 'build'
    description = '构建 settings.json 中列出的所有 MC 版本'
}

gradle.projectsEvaluated {
    Map<String, List<String>> settings = file("${rootDir}/settings.json").withReader {
        new JsonSlurper().parse(it) as Map<String, List<String>>
    }
    settings.get('versions').each { version ->
        tasks.named('buildAll') { dependsOn(":${version}:build") }
    }
}
