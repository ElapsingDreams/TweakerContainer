import com.replaymod.gradle.preprocess.Node
import groovy.json.JsonSlurper

plugins {
    // Loom 在各版本子项目里 apply（见 versions/1.21.8-fabric/build.gradle）
    id 'fabric-loom' version "${loom_version}" apply false
    id 'com.replaymod.preprocess' version "${preprocessor_version}"
}

// 多版本节点表：数字是版本号的可比较编码，第三个参数是这套源码使用的映射命名空间。
// 条件编译指令（//#if MC >= 12108 之类）里的数字就是这个编码。
preprocess {
    // 共享源码（根目录 src/main）以哪个版本子项目为"主项目"：
    // 插件默认读 <版本目录>/../mainProject，也就是 versions/mainProject，里面写着主项目名
    Node mc12108_fabric = createNode('1.21.8-fabric', 1_21_08, 'mojang')

    // 26.2 节点在源码迁到 Mojang 官方映射之后再接上（26.x 不再混淆，没有 yarn）
    // Node mc2602_fabric = createNode('26.2-fabric', 26_02_00, 'mojang')
    // mc12108_fabric.link(mc2602_fabric, null)
}

// 一次构建 settings.json 里列出的所有版本：gradlew buildAll
tasks.register('buildAll') {
    group = 'build'
    description = '构建 settings.json 中列出的所有 MC 版本'
}

gradle.projectsEvaluated {
    Map<String, List<String>> settings = file("${rootDir}/settings.json").withReader {
        new JsonSlurper().parse(it) as Map<String, List<String>>
    }
    settings.get('versions').each { version ->
        tasks.named('buildAll') { dependsOn(":${version}:build") }
    }
}
