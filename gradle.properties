# 26.2 要求跑 Gradle 的那个 JVM 是 Java 25（Loom 会直接检查），所以这里固定用本机的 Java 25；
# Java 25 构建 1.21.x 那一档也没问题，两边共用同一个 Gradle JVM。
# 换机器时改这一行即可（或删掉，改用环境变量 JAVA_HOME / IDEA 的 Gradle JVM 设置）。
org.gradle.java.home=C:/Users/Envision/AppData/Roaming/.minecraft/runtime/java-runtime-epsilon
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---- Mod 属性 ----
# 版本号规则：a.b 不轻易动（要完全没 bug 才升 b），日常只升 c
mod_version=2.2.5
maven_group=cn.yireve
archives_base_name=tweakercontainer

# ---- 构建插件 ----
# 26.2 需要较新的 Loom（26.x 未混淆、Java 25），这里统一用一个较新的版本，两个版本共用
loom_version=1.17.21

# 每个 MC 版本自己的依赖写在 versions/<版本>/gradle.properties 里，这里不放版本相关的东西
