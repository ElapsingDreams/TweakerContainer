# Gradle itself needs JDK 17+: make sure JAVA_HOME (or the IDE's Gradle JVM) points to a JDK 21 install.
# Machine-specific override: set org.gradle.java.home in ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_dependency = >=1.21.6 <=1.21.8
minecraft_version=1.21.7
yarn_mappings=1.21.7+build.6
loader_version=0.17.0
# Mod Properties
mod_version=2.2.5
maven_group=cn.yireve
archives_base_name=tweakercontainer
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_asm_version=2.3
fabric_api_version=0.129.0+1.21.7

# https://jitpack.io/com/github/sakura-ryoko/malilib/
# malilib_version=1.21.7-0.25.1
#lib 0.25.7 1.21.6-1.21.8
malilib_lib_version=1.21.8-0.25.7
malilib_dependency=~0.25.0

# https://jitpack.io/com/github/sakura-ryoko/litematica/
