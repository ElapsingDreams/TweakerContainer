# Gradle itself needs JDK 17+: make sure JAVA_HOME (or the IDE's Gradle JVM) points to a JDK 21 install.
# Machine-specific override: set org.gradle.java.home in ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---- Mod 属性 ----
# 版本号规则：a.b 不轻易动（要完全没 bug 才升 b），日常只升 c
mod_version=2.2.5
maven_group=cn.yireve
archives_base_name=tweakercontainer

# ---- 构建插件 ----
# 26.2 需要较新的 Loom（26.x 未混淆、Java 25），这里统一用一个较新的版本，两个版本共用
loom_version=1.17.21

# 每个 MC 版本自己的依赖写在 versions/<版本>/gradle.properties 里，这里不放版本相关的东西
