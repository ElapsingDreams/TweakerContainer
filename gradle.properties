# NOTE: .properties files are read as ISO-8859-1 by Java/IDEA, so these comments are ASCII-only.
# The Chinese version of this explanation lives in docs/multi-version-build.md.
#
# MC 26.2 requires the Gradle JVM to be Java 25 (Loom checks this directly), so it is pinned here.
# Java 25 builds the 1.21.x node fine as well, both nodes share this one Gradle JVM.
# On another machine, change this line (or delete it and use JAVA_HOME / the IDE's Gradle JVM).
org.gradle.java.home=C:/Users/Envision/AppData/Roaming/.minecraft/runtime/java-runtime-epsilon
# The 26.2 node declares a Java 25 toolchain; point Gradle at the local Java 25 install instead of
# downloading one (the foojay resolver plugin is incompatible with Gradle 9.5, see settings.gradle).
org.gradle.java.installations.paths=C:/Users/Envision/AppData/Roaming/.minecraft/runtime/java-runtime-epsilon
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---- Mod properties ----
# Version rule: only bump a.b when completely bug-free, otherwise bump c only.
mod_version=2.3.0
maven_group=cn.yireve
archives_base_name=tweakercontainer

# ---- Build plugins ----
# MC 26.2 needs a recent Loom (26.x is unobfuscated and runs on Java 25); one version serves both nodes.
loom_version=1.17.21

# Per-MC-version dependencies live in versions/<version>/gradle.properties, not here.
