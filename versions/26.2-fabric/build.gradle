// Minecraft 26.2 这一档的构建：26.1+ 官方 jar 不再混淆（也没有 mappings 可用了），
// 所以用 Loom 的"不重映射"变体 net.fabricmc.fabric-loom：
//   - 不需要 mappings
//   - 依赖用普通 implementation / runtimeOnly（不再是 modImplementation）
//   - 没有 remapJar，产物就是普通 jar
// 源码放在本版本目录自己的 src/ 下（versions/26.2-fabric/src/），与 1.21.x 那份互不影响。
plugins {
    id 'maven-publish'
}

apply(plugin: 'net.fabricmc.fabric-loom')

// 运行目录按版本分开放（仓库根目录下，已被 .gitignore 忽略）
loom {
    runs {
        client {
            runDir "${rootDir}/run/26.2"
        }
        server {
            runDir "${rootDir}/run/26.2-server"
        }
    }
}

base {
    // 产物名形如 tweakercontainer-2.2.5-26.2.jar
    archivesName = rootProject.property('archives_base_name')
    group = rootProject.property('maven_group')
    version = "${rootProject.property('mod_version')}-${project.property('dependencies.minecraft_version')}"
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven/' }
    maven { url = 'https://maven.fabricmc.net/' }
    // malilib / litematica 的传递依赖（conditional-mixin 等）
    maven { url = 'https://maven.fallenbreath.me/releases' }
    // malilib / litematica：sakura-ryoko 的社区构建
    maven {
        url = 'https://masa.dy.fi/maven/sakura-ryoko'
        content { includeGroupAndSubgroups('fi.dy.masa') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.property('dependencies.minecraft_version')}"
    // 26.x 官方 jar 未混淆，不需要 mappings；依赖也不再需要 modImplementation。
    // Fabric API 在 26.2 这边要按模块声明（umbrella 那个 jar 里是嵌套模块，未重映射的变体不会展开它）
    implementation "net.fabricmc:fabric-loader:${project.property('dependencies.loader_version')}"
    [
            'fabric-api-base',
            'fabric-lifecycle-events-v1',
            'fabric-networking-api-v1',
            'fabric-rendering-v1',
            'fabric-events-interaction-v0'
    ].each { module ->
        implementation fabricApi.module(module, project.property('dependencies.fabric_api_version'))
    }

    implementation "fi.dy.masa.malilib:malilib-fabric-${project.property('dependencies.dep_mc')}:${project.property('dependencies.malilib_version')}"
    implementation "fi.dy.masa.litematica:litematica-fabric-${project.property('dependencies.dep_mc')}:${project.property('dependencies.litematica_version')}"
}

processResources {
    inputs.property 'version', rootProject.property('mod_version')
    inputs.property 'minecraft_dependency', project.property('dependencies.minecraft_dependency')
    inputs.property 'loader_version', project.property('dependencies.loader_version')
    inputs.property 'malilib_dependency', project.property('dependencies.malilib_dependency')
    inputs.property 'litematica_dependency', project.property('dependencies.litematica_dependency')
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand 'version': rootProject.property('mod_version'),
                'minecraft_version': project.property('dependencies.minecraft_version'),
                'minecraft_dependency': project.property('dependencies.minecraft_dependency'),
                'loader_version': project.property('dependencies.loader_version'),
                'malilib_dependency': project.property('dependencies.malilib_dependency'),
                'litematica_dependency': project.property('dependencies.litematica_dependency')
    }
}

// Minecraft 26.1+ 用 Java 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(25)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
